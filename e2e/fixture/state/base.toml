# Test: install a package
[resource.pkg.jq]
name = "jq"
state = "present"

# Test: write a file with variable interpolation
[resource.file.greeting]
path = "/tmp/verg-test.txt"
content = "{{ greeting }}"
mode = "0644"

# Test: command with guard
[resource.cmd.marker]
command = "echo 'verg was here' > /tmp/verg-marker"
creates = "/tmp/verg-marker"

# Test: custom lineinfile resource
[resource.lineinfile.banner]
path = "/tmp/verg-motd"
line = "Managed by verg"

# Test: create a local user with a specific shell
[resource.user.appuser]
name = "appuser"
state = "present"
shell = "/bin/sh"

# Test: clone a git repository
[resource.git.app]
url = "file:///tmp/repo.git"
path = "/tmp/app-checkout"
ref = "main"

# Test: manage a cron job (writes /etc/cron.d/<name>, no daemon required)
[resource.cron.verg-backup]
schedule = "0 3 * * *"
command = "/usr/local/bin/backup.sh"
user = "root"

# Test: download a file (curl fetches a local file:// URL), verify checksum + mode
[resource.download.payload]
url = "file:///tmp/verg-download-seed.txt"
dest = "/tmp/verg-downloaded.txt"
checksum = "303b8a868e82b87350c892f503009693c37fe736bc5b2ef9e2f0a26e1014c7cd"
mode = "0640"
